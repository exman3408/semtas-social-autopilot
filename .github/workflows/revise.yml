name: 6 - Bekleyen premium revizyonu uret ve mobil onaya gonder
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revise.yml'
permissions:
  contents: write
concurrency:
  group: semtas-autopilot
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Revize bekleyen gorselleri yeni surum olarak uret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_ENGINE: gemini
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-nano-banana-2.1' }}
          ALLOW_PAID_GEMINI_IMAGE_API: ${{ vars.ALLOW_PAID_GEMINI_IMAGE_API || 'false' }}
          REQUIRE_GENERATIVE_IMAGE: 'true'
        run: python -m socialbot.revise render
      - name: Kaydet - henuz yayin onayi yok
        run: |
          git config user.name 'Semtas Autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git add content/posts docs/media
          if ! git diff --cached --quiet; then
            git commit -m 'revision: premium artwork draft for owner review'
            git push
          fi
  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Yeni revizyon icin mobil GitHub Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: python -m socialbot.revise request
      - name: Kaydet mobil onay baglantisi
        run: |
          git config user.name 'Semtas Autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git add content/posts
          if ! git diff --cached --quiet; then
            git commit -m 'review: issue for newly revised art'
            git push
          fi
