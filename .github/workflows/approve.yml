name: 4 - Semtas mobil onay ve revize
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: read
concurrency:
  group: semtas-autopilot
  cancel-in-progress: false
jobs:
  review:
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      github.event.issue.user.login == 'github-actions[bot]' &&
      (github.event.comment.body == '/onayla' || github.event.comment.body == '/reddet' || startsWith(github.event.comment.body, '/revize '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Yalnizca depo sahibinin onayini isle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m socialbot.review apply
      - name: Onay kararini kaydet
        run: |
          git config user.name 'Semtas Autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git add content/posts
          if ! git diff --cached --quiet; then
            git commit -m 'review: save owner approval decision'
            git push
          fi
      - name: Onaylandiysa ve ana anahtar aciksa Buffer'a siraya al
        if: github.event.comment.body == '/onayla'
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.BUFFER_LINKEDIN_CHANNEL_ID }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          BUFFER_BRAND_CHECK: semtas
        run: |
          python -m socialbot queue
          git add content/posts
          if ! git diff --cached --quiet; then
            git commit -m 'review: update Buffer queue status'
            git push
          fi
