name: 1 - Semtas icerik hazirla
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare.yml'
  schedule:
    - cron: '10 5 * * 1-5'
permissions:
  contents: write
concurrency:
  group: semtas-autopilot
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Research, copy, artwork
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          DEMO_MODE: 'false'
          IMAGE_ENGINE: gemini
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-nano-banana-2.1' }}
          ALLOW_PAID_GEMINI_IMAGE_API: ${{ vars.ALLOW_PAID_GEMINI_IMAGE_API || 'false' }}
          REQUIRE_GENERATIVE_IMAGE: 'true'
        run: python -m socialbot prepare
      - name: Save generated posts and media
        run: |
          git config user.name 'Semtas Autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git add content/posts docs/media
          if ! git diff --cached --quiet; then
            git commit -m 'autopilot: prepare social content'
            git push
          fi
  deploy-media:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
  review-request:
    name: Mobil onay istegi
    needs: deploy-media
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: GitHub Mobile bildirimli onay istegi olustur
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: python -m socialbot.review request
      - name: Issue numarasini ve onay durumunu kaydet
        run: |
          git config user.name 'Semtas Autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git add content/posts
          if ! git diff --cached --quiet; then
            git commit -m 'review: create owner approval request'
            git push
          fi
