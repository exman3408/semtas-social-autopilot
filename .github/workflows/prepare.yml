name: 1 - Semtas icerik hazirla
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare.yml'
  schedule:
    - cron: '10 5 * * 1-5'
permissions:
  contents: write
concurrency:
  group: semtas-autopilot
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Research, copy, artwork
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          DEMO_MODE: 'false'
        run: python -m socialbot prepare
      - name: Save generated posts and media
        run: |
          git config user.name 'Semtas Autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git add content/posts docs/media
          if ! git diff --cached --quiet; then
            git commit -m 'autopilot: prepare social content'
            git push
          fi
  deploy-media:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
